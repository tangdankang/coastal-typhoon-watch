name: Update typhoon data and deploy Pages

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/update-and-deploy.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scheduled source/build failures leave the last safe deployment online.
    # They are visible in Actions but do not fail the whole workflow, avoiding
    # recurring failure emails. Manual and push runs still fail normally.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    outputs:
      artifact-ready: ${{ steps.ready.outputs.value }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test normalization, failures and demo separation
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
      - name: Fetch Zhejiang public data
        run: npm run fetch:data
      - name: Build existing application
        run: npm run build
      - name: Export separate demo and live Pages artifact
        run: |
          npm run export:html
          npm run build:pages
          npm run test:pages
      - name: Upload validated static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/pages-dist
      - name: Mark artifact ready
        id: ready
        run: echo "value=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: needs.build.outputs.artifact-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
